apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-argo-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/govind2325/argocd-demo.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
    - CreateNamespace=true  

    automated:
      selfHeal: true
      prune: true